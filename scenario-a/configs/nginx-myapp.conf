# /etc/nginx/sites-available/abdur-myapp   (symlink into sites-enabled)
# exam token: root-vmi3536696-1788282556-1536d427
#
#   sudo cp nginx-myapp.conf /etc/nginx/sites-available/abdur-myapp
#   sudo ln -sf /etc/nginx/sites-available/abdur-myapp /etc/nginx/sites-enabled/abdur-myapp
#   # NOTE: do NOT remove sites-enabled/default -- shared server, it is not mine
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is included from inside nginx.conf's http{} block, which is why the
# limit_req_zone below is legal here -- it is an http-context directive and
# would be rejected inside server{}.

# ---------------------------------------------------------------- upstream ---
upstream abdur_backends {
    # 127.0.0.1, NOT localhost. nginx resolves localhost at config-parse time
    # and on a dual-stack Ubuntu box that can come back as [::1]. My app binds
    # 0.0.0.0, which is IPv4 only, so an IPv6 upstream gives a 502 that looks
    # exactly like "the backend is down" while `curl localhost:3101` from the
    # same server works perfectly. `ss -lntp` is what shows you the difference.

    # --- algorithm ---
    # (default) round robin: strict alternation, ignores how busy a backend is.
    # least_conn;  # send to the backend with the fewest active connections --
    #              # this is the one that matters when /slow exists, because
    #              # round robin keeps feeding a backend that is stuck.
    # ip_hash;     # same client IP always lands on the same backend. Gives you
    #              # sticky sessions, and destroys the distribution when all
    #              # your load comes from one IP -- which is exactly what a
    #              # `for i in $(seq 1 100)` loop from localhost looks like.

    # max_fails / fail_timeout are nginx open source's PASSIVE health check.
    # nginx never polls the backend. It counts failed proxied requests, and
    # after max_fails failures within fail_timeout it stops sending traffic
    # there for fail_timeout seconds, then tentatively tries again.
    #
    # Task 18 asks for these to be changed to max_fails=1 fail_timeout=30s and
    # the numbers re-measured.
    server 127.0.0.1:3101 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3102 max_fails=3 fail_timeout=10s;

    # keepalive to the upstream: reuses TCP connections instead of a new
    # handshake per request. Needs the proxy_http_version/Connection pair below.
    keepalive 32;
}

# ------------------------------------------------------------ rate limiting ---
# Task 20. $binary_remote_addr is the client IP in packed form -- 4 bytes for
# IPv4 instead of the ~15 a string takes, so a 10m zone holds roughly 160k
# addresses. Use $binary_remote_addr, never $remote_addr, for exactly that
# reason.
#
# IMPORTANT once nginx is behind another proxy or a CDN: $binary_remote_addr is
# then the proxy's address and you would rate limit the whole internet as one
# client. That is what real_ip_header/set_real_ip_from are for.
# limit_req_zone MUST be here: it allocates shared memory and is http-context
# only. The zone NAME is prefixed so it cannot collide with another student's.
limit_req_zone $binary_remote_addr zone=abdur_api_limit:10m rate=10r/s;

# limit_req_status and limit_req_log_level are deliberately NOT here.
#
# Every file in sites-enabled/ is included into the SAME http{} block, and
# these two directives may appear only once per context. Another student on
# this shared VPS already sets limit_req_status at http level, so putting mine
# here failed the whole config:
#
#   [emerg] "limit_req_status" directive is duplicate in .../abdur-myapp:56
#   nginx: configuration file test failed
#
# That is not a name collision -- prefixing does not help, because the
# directive itself is what must be unique. Both are valid in server{} context,
# so they live in my server block below where they apply to my traffic only
# and cannot break anyone else's site.

server {
    # NOT `listen 80 default_server`. This VPS is shared with other students
    # and `default_server` can only belong to one server block in the whole of
    # nginx -- claiming it would silently hijack everyone else's traffic. 8110
    # is allocated to me. The proxy behaviour being tested is identical.
    listen 8110;
    listen [::]:8110;
    server_name _;

    access_log /var/log/nginx/abdur-myapp.access.log;
    error_log  /var/log/nginx/abdur-myapp.error.log warn;

    # Moved down here out of the http context -- see the note above the zone.
    # 429 rather than nginx's default 503: 503 tells the client "the server is
    # broken", which makes well-behaved clients and CDNs retry -- the opposite
    # of what a rate limiter wants. 429 says "you are going too fast".
    limit_req_status 429;
    limit_req_log_level warn;

    # ------------------------------------------------------ shared proxying ---
    # Everything the backends need in order to see the real client. Without
    # these, req.socket.remoteAddress in the app is always 127.0.0.1, because
    # nginx -- not the visitor -- is the thing that opened the TCP connection.
    # /whoami proves it.
    location / {
        proxy_pass http://abdur_backends;

        proxy_http_version 1.1;
        proxy_set_header Connection "";          # required for upstream keepalive

        # The original Host, so the app can do vhost routing or build absolute
        # URLs. $host is the requested name; $proxy_host would be the upstream.
        proxy_set_header Host              $host;
        # The immediate client's IP: one value, always trustworthy here because
        # nginx sets it itself.
        proxy_set_header X-Real-IP         $remote_addr;
        # The chain. $proxy_add_x_forwarded_for appends $remote_addr to any
        # header the client already sent -- which is why the client-supplied
        # part of this header can never be trusted for auth or rate limiting.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # http or https as seen by the CLIENT, so the app does not build http://
        # redirects on a TLS site and cause a redirect loop.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Fail over to the other backend on these conditions. http_502/503/504
        # are deliberately included; note that non-idempotent requests are only
        # retried if you add non_idempotent, which I have NOT done -- silently
        # replaying a POST is how you get duplicate charges.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        proxy_connect_timeout 3s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;
    }

    # ------------------------------------------------------ the 504 (task 19) ---
    # /slow takes 45 seconds. Default proxy_read_timeout is 60s, so it would
    # normally squeak through. Forcing 5s here makes the 504 reproducible:
    #
    #   time curl -i http://localhost:8110/slow      -> 504 after ~5s
    #
    # Then raise it to 60s, reload, and the same request succeeds after 45s.
    # Why raising it is the wrong fix is answered in ../ANSWERS.md task 19.
    location /slow {
        proxy_pass http://abdur_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;    # <-- make it fail:  5s
        # proxy_read_timeout  60s;   # <-- make it pass: 60s
        proxy_send_timeout    5s;

        # A 504 must never be retried on the other backend: that just makes the
        # second backend spend 45 seconds on a request the client has given up
        # on. This is the single most useful line in the file.
        proxy_next_upstream off;
    }

    # ------------------------------------------------- rate limited API (20) ---
    location /api/ {
        # rate=10r/s with burst=20 nodelay: 20 requests are let through
        # immediately, then the bucket refills at 10/s and everything else gets
        # 429. Without `nodelay` nginx would QUEUE the burst and serve it slowly
        # instead of rejecting it, and 50 fast requests would all return 200 --
        # which is why the "prove it" loop shows nothing if you forget it.
        limit_req zone=abdur_api_limit burst=20 nodelay;

        proxy_pass http://abdur_backends;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's own liveness, answered without touching a backend. Useful for
    # telling "nginx is down" apart from "both backends are down".
    location = /abdur-nginx-healthz {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # Upstream status is not in open-source nginx; stub_status is what there is.
    location = /abdur-nginx-status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}

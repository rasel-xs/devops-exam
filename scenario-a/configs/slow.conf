# Deliberately slow config, used only to prove the flock guard (task 9 req 7).
# 10.255.255.x is RFC1918 space with nothing routed to it, so each connection
# attempt sits until --connect-timeout 3 expires rather than being refused
# instantly. Three entries -> the run takes ~9s, which is a wide enough window
# to start a second copy by hand and watch it decline to run.
blackhole-1|http://10.255.255.1/|200
blackhole-2|http://10.255.255.2/|200
blackhole-3|http://10.255.255.3/|200

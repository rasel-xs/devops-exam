# exam token: root-vmi3536696-1788282556-1536d427
# B5 tasks 43-46 -- the main branch pipeline.
#
# CREDENTIALS POLICY (the brief makes this an instant zero):
#   * The registry is GHCR, authenticated with the ephemeral ${{ github.token }}
#     that GitHub mints per run. It expires when the job ends. There is no
#     registry password stored anywhere in this repo.
#   * There is NO AWS_SECRET_ACCESS_KEY, and no static access key of any kind.
#     Scenario C uses OIDC role assumption; the commented block at the bottom is
#     the same pattern and works here too.
#   * The VPS deploy uses an SSH key in a repository secret. That IS a
#     long-lived credential and I am not pretending otherwise -- what limits it
#     is that the key is restricted to one command on the server (see
#     ANSWERS.md), it is scoped to the `production` environment so only an
#     approved deployment can read it, and it can be rotated from one place.
name: Deploy

on:
  push:
    branches: [main]

# Task 46. cancel-in-progress is deliberately FALSE here, unlike the PR
# workflow: cancelling a half-finished deploy leaves the service mid-rollout.
# Queue them instead.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # OIDC, for the AWS job in Scenario C

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/notes-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the tag count below can see history, not just one commit.
          fetch-depth: 0

      - name: Derive a version tag
        id: version
        run: |
          # A monotonic v1.0.N from the commit count, so every push to main gets
          # a distinct, ordered, human-readable version alongside the SHA.
          N=$(git rev-list --count HEAD)
          echo "version=v1.0.$N" >> "$GITHUB_OUTPUT"
          echo "building v1.0.$N from ${GITHUB_SHA:0:7}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Minted for this run, expires with it. NOT a stored secret.
          password: ${{ github.token }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            exam.token=root-vmi3536696-1788282556-1536d427

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: scenario-b/app
          file: scenario-b/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch. Worth it because my VPS is amd64 and my laptop is an
          # arm64 Mac: a single-arch amd64 image runs on the Mac only through
          # emulation, slowly, and an arm64-only image will not run on the VPS
          # AT ALL -- it fails with "exec format error", which looks like a
          # broken binary rather than an architecture mismatch.
          # Cost: roughly double the build time, since the non-native arch is
          # built under QEMU.
          platforms: linux/amd64,linux/arm64

      - name: Show what was pushed
        run: |
          echo "tags:   ${{ steps.meta.outputs.tags }}"
          echo "digest: ${{ steps.push.outputs.digest }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Task 44 -- the approval gate. `production` is configured in
    # Settings -> Environments with a required reviewer, which is what makes the
    # run pause with "Review pending deployments". Environment-scoped secrets
    # are also unreadable by any job that has not passed the gate.
    environment:
      name: production
      url: http://169.58.246.108:3140/
    steps:
      - name: Deploy to the swarm over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            IMAGE="ghcr.io/${{ github.repository_owner }}/notes-api:${{ needs.build-and-push.outputs.version }}"
            echo "deploying $IMAGE"

            # `service update` is a ROLLING update of the existing service. It
            # is what makes a failed deploy safe: the old tasks keep serving
            # until the new ones are healthy, and --update-failure-action
            # rollback puts the previous image back automatically.
            #
            # Deliberately NOT `docker service rm && docker service create`:
            # that deletes the service first, so the site is down for the whole
            # deploy and a failure leaves nothing running at all.
            docker service update \
              --image "$IMAGE" \
              --update-order start-first \
              --update-parallelism 1 \
              --update-delay 10s \
              --update-monitor 20s \
              --update-failure-action rollback \
              --with-registry-auth \
              abdur_notes_app

            docker service ps abdur_notes_app --no-trunc | head -10

      - name: Verify the deployed version actually answers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3140/healthz | grep -q '"status":"ok"'; then
                echo "live and healthy"
                curl -s http://localhost:3140/healthz
                exit 0
              fi
              sleep 2
            done
            echo "::error::deployed service did not become healthy"
            docker service ps abdur_notes_app --no-trunc
            exit 1

# ---------------------------------------------------------------------------
# OIDC instead of stored credentials -- the Scenario C pattern, which also works
# here. No key material exists anywhere: GitHub mints a short-lived OIDC token,
# AWS exchanges it for temporary STS credentials, and the trust policy on the
# role restricts which repo and which branch may assume it.

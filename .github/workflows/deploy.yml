# B5 tasks 43-46 -- the main branch pipeline.
#
# CREDENTIALS POLICY (the brief makes this an instant zero):
#   * The registry is GHCR, authenticated with the ephemeral ${{ github.token }}
#     that GitHub mints per run. It expires when the job ends. There is no
#     registry password stored anywhere in this repo.
#   * There is NO AWS_SECRET_ACCESS_KEY, and no static access key of any kind.
#     Scenario C uses OIDC role assumption; the commented block at the bottom is
#     the same pattern and works here too.
#   * The VPS deploy uses an SSH key in a repository secret. That IS a
#     long-lived credential and I am not pretending otherwise -- what limits it
#     is that the key is restricted to one command on the server (see
#     ANSWERS.md), it is scoped to the `production` environment so only an
#     approved deployment can read it, and it can be rotated from one place.
name: Deploy

on:
  push:
    branches: [main]

# Task 46. cancel-in-progress is deliberately FALSE here, unlike the PR
# workflow: cancelling a half-finished deploy leaves the service mid-rollout.
# Queue them instead.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # OIDC, for the AWS job in Scenario C

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/notes-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the tag count below can see history, not just one commit.
          fetch-depth: 0

      - name: Derive a version tag
        id: version
        run: |
          # A monotonic v1.0.N from the commit count, so every push to main gets
          # a distinct, ordered, human-readable version alongside the SHA.
          N=$(git rev-list --count HEAD)
          echo "version=v1.0.$N" >> "$GITHUB_OUTPUT"
          echo "building v1.0.$N from ${GITHUB_SHA:0:7}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Minted for this run, expires with it. NOT a stored secret.
          password: ${{ github.token }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            exam.token=root-vmi3536696-1788282556-1536d427

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: scenario-b/app
          file: scenario-b/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every image reports APP_VERSION=v1 from /healthz no
          # matter which tag it carries -- see the comment in the Dockerfile.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch. Worth it because my VPS is amd64 and my laptop is an
          # arm64 Mac: a single-arch amd64 image runs on the Mac only through
          # emulation, slowly, and an arm64-only image will not run on the VPS
          # AT ALL -- it fails with "exec format error", which looks like a
          # broken binary rather than an architecture mismatch.
          # Cost: roughly double the build time, since the non-native arch is
          # built under QEMU.
          platforms: linux/amd64,linux/arm64

      - name: Show what was pushed
        run: |
          echo "tags:   ${{ steps.meta.outputs.tags }}"
          echo "digest: ${{ steps.push.outputs.digest }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Task 44 -- the approval gate. `production` is configured with a required
    # reviewer, which is what makes the run pause on "Review pending
    # deployments". It also does something the pause does not advertise: all
    # four VPS secrets are scoped to THIS environment, not to the repository, so
    # no other job -- including one added by a malicious PR -- can read the
    # deploy key at all.
    environment:
      name: production
      url: http://169.58.246.108:3140/
    steps:
      # Deliberately plain ssh rather than a third-party action. A marketplace
      # action that receives the private key is one more supply-chain hop for
      # the most sensitive secret in the repository, and here it buys nothing:
      # the whole remote side is one forced command taking one argument.
      - name: Deploy to the swarm over SSH
        env:
          SSH_KEY:     ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST:    ${{ secrets.VPS_HOST }}
          VPS_USER:    ${{ secrets.VPS_USER }}
          VERSION:     ${{ needs.build-and-push.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # StrictHostKeyChecking=yes with a PINNED host key, not `no` and not
          # `accept-new`. Both of those hand the deploy key to whoever answers
          # on port 22 the first time. With the key pinned in a secret, a
          # man-in-the-middle gets a refusal instead of root.
          #
          # The remote end is a forced command (scenario-b/deploy/abdur-deploy.sh):
          # this string lands in SSH_ORIGINAL_COMMAND and is validated against a
          # tag allow-list before anything runs. The key cannot open a shell --
          # see evidence/b5-deploykey-restriction.txt.
          # ServerAliveInterval matters: the first run of this deploy updated all
          # three replicas successfully and then died with
          # "client_loop: send disconnect: Broken pipe", exit 255, during the
          # remote health-check loop. The deploy had worked; the SSH transport
          # had not survived a quiet minute over the public internet. Keepalives
          # turn that silence into traffic.
          ssh -n -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              -o TCPKeepAlive=yes \
              "$VPS_USER@$VPS_HOST" "deploy $VERSION"

      # An independent check, from outside the VPS. The remote script already
      # verifies over localhost; this one goes through the published port from
      # the public internet, so it also covers the routing mesh and the firewall
      # -- neither of which a localhost curl on the box can see.
      - name: Verify the new version answers from the internet
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VERSION:  ${{ needs.build-and-push.outputs.version }}
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            body=$(curl -sf --max-time 5 "http://$VPS_HOST:3140/healthz" || true)
            if [ -n "$body" ]; then
              echo "$body"
              echo "deployed version was $VERSION"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the service is not reachable from the internet after the deploy"
          exit 1


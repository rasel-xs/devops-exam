# exam token: root-vmi3536696-1788282556-1536d427
# B5 tasks 43-46 -- the main branch pipeline.
#
# CREDENTIALS POLICY (the brief makes this an instant zero):
#   * The registry is GHCR, authenticated with the ephemeral ${{ github.token }}
#     that GitHub mints per run. It expires when the job ends. There is no
#     registry password stored anywhere in this repo.
#   * There is NO AWS_SECRET_ACCESS_KEY, and no static access key of any kind.
#     Scenario C uses OIDC role assumption; the commented block at the bottom is
#     the same pattern and works here too.
#   * The VPS deploy uses an SSH key in a repository secret. That IS a
#     long-lived credential and I am not pretending otherwise -- what limits it
#     is that the key is restricted to one command on the server (see
#     ANSWERS.md), it is scoped to the `production` environment so only an
#     approved deployment can read it, and it can be rotated from one place.
name: Deploy

on:
  push:
    branches: [main]

# Task 46. cancel-in-progress is deliberately FALSE here, unlike the PR
# workflow: cancelling a half-finished deploy leaves the service mid-rollout.
# Queue them instead.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write        # push to GHCR
  id-token: write        # OIDC, for the AWS job in Scenario C

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/notes-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the tag count below can see history, not just one commit.
          fetch-depth: 0

      - name: Derive a version tag
        id: version
        run: |
          # A monotonic v1.0.N from the commit count, so every push to main gets
          # a distinct, ordered, human-readable version alongside the SHA.
          N=$(git rev-list --count HEAD)
          echo "version=v1.0.$N" >> "$GITHUB_OUTPUT"
          echo "building v1.0.$N from ${GITHUB_SHA:0:7}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Minted for this run, expires with it. NOT a stored secret.
          password: ${{ github.token }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            exam.token=root-vmi3536696-1788282556-1536d427

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: scenario-b/app
          file: scenario-b/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without this every image reports APP_VERSION=v1 from /healthz no
          # matter which tag it carries -- see the comment in the Dockerfile.
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch. Worth it because my VPS is amd64 and my laptop is an
          # arm64 Mac: a single-arch amd64 image runs on the Mac only through
          # emulation, slowly, and an arm64-only image will not run on the VPS
          # AT ALL -- it fails with "exec format error", which looks like a
          # broken binary rather than an architecture mismatch.
          # Cost: roughly double the build time, since the non-native arch is
          # built under QEMU.
          platforms: linux/amd64,linux/arm64

      - name: Show what was pushed
        run: |
          echo "tags:   ${{ steps.meta.outputs.tags }}"
          echo "digest: ${{ steps.push.outputs.digest }}"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Task 44 -- the approval gate. `production` is configured with a required
    # reviewer, which is what makes the run pause on "Review pending
    # deployments". It also does something the pause does not advertise: all
    # four VPS secrets are scoped to THIS environment, not to the repository, so
    # no other job -- including one added by a malicious PR -- can read the
    # deploy key at all.
    environment:
      name: production
      url: http://169.58.246.108:3140/
    steps:
      # Deliberately plain ssh rather than a third-party action. A marketplace
      # action that receives the private key is one more supply-chain hop for
      # the most sensitive secret in the repository, and here it buys nothing:
      # the whole remote side is one forced command taking one argument.
      - name: Deploy to the swarm over SSH
        env:
          SSH_KEY:     ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST:    ${{ secrets.VPS_HOST }}
          VPS_USER:    ${{ secrets.VPS_USER }}
          VERSION:     ${{ needs.build-and-push.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"     > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

          # StrictHostKeyChecking=yes with a PINNED host key, not `no` and not
          # `accept-new`. Both of those hand the deploy key to whoever answers
          # on port 22 the first time. With the key pinned in a secret, a
          # man-in-the-middle gets a refusal instead of root.
          #
          # The remote end is a forced command (scenario-b/deploy/abdur-deploy.sh):
          # this string lands in SSH_ORIGINAL_COMMAND and is validated against a
          # tag allow-list before anything runs. The key cannot open a shell --
          # see evidence/b5-deploykey-restriction.txt.
          # ServerAliveInterval matters: the first run of this deploy updated all
          # three replicas successfully and then died with
          # "client_loop: send disconnect: Broken pipe", exit 255, during the
          # remote health-check loop. The deploy had worked; the SSH transport
          # had not survived a quiet minute over the public internet. Keepalives
          # turn that silence into traffic.
          ssh -n -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              -o TCPKeepAlive=yes \
              "$VPS_USER@$VPS_HOST" "deploy $VERSION"

      # An independent check, from outside the VPS. The remote script already
      # verifies over localhost; this one goes through the published port from
      # the public internet, so it also covers the routing mesh and the firewall
      # -- neither of which a localhost curl on the box can see.
      - name: Verify the new version answers from the internet
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VERSION:  ${{ needs.build-and-push.outputs.version }}
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            body=$(curl -sf --max-time 5 "http://$VPS_HOST:3140/healthz" || true)
            if [ -n "$body" ]; then
              echo "$body"
              echo "deployed version was $VERSION"
              exit 0
            fi
            sleep 3
          done
          echo "::error::the service is not reachable from the internet after the deploy"
          exit 1

  # ---------------------------------------------------------------------------
  # Scenario C task 53 -- the same build, deployed to ECS Fargate.
  #
  # NO AWS KEYS EXIST ANYWHERE. GitHub mints a short-lived OIDC token for this
  # job (id-token: write); AWS exchanges it for STS credentials of the role
  # abdur-github-actions-ecs-deploy, whose trust policy
  # (scenario-c/iam/abdur-github-actions-ecs-deploy-trust.json) accepts ONLY
  #   aud = sts.amazonaws.com
  #   sub = repo:rasel-xs/devops-exam:ref:refs/heads/main
  # A fork, another repository, a pull request or any other branch gets a
  # different `sub` and is refused.
  #
  # Deliberately NO `environment:` on this job. An environment changes the OIDC
  # subject to repo:...:environment:<name>, which the trust policy does not
  # accept -- the branch condition is the gate here.
  #
  # It needs build-and-push only, not the VPS deploy: the VPS waits for a human
  # approval, and ECS should not wait behind it.
  # ---------------------------------------------------------------------------
  deploy-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read       # checkout, for the task definition file
      packages: read       # read the image back from GHCR
      id-token: write      # OIDC -> AWS
    env:
      AWS_REGION: eu-north-1
      ROLE_ARN: arn:aws:iam::750069566598:role/abdur-github-actions-ecs-deploy
      ECR_REPOSITORY: abdur-notes-api
      CLUSTER: abdur-exam-cluster
      SERVICE: abdur-notes-svc
      ALB_URL: http://abdur-notes-alb-2056595441.eu-north-1.elb.amazonaws.com
      VERSION: ${{ needs.build-and-push.outputs.version }}
      GHCR_DIGEST: ${{ needs.build-and-push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role via OIDC (no stored credentials)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show who we are now
        run: aws sts get-caller-identity

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GHCR (read the image just built)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3

      # Copy, do not rebuild. The image that passed the build job is copied
      # manifest-for-manifest from GHCR to ECR, so ECR holds the SAME artefact,
      # identified by the same digest -- not a second build that merely has the
      # same tag.
      - name: Copy the image from GHCR to ECR
        id: copy
        run: |
          set -euo pipefail
          SRC="ghcr.io/${{ github.repository_owner }}/notes-api@${GHCR_DIGEST}"
          DST="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${VERSION}"
          docker buildx imagetools create --tag "$DST" "$SRC"
          ECR_DIGEST=$(docker buildx imagetools inspect "$DST" --format '{{json .Manifest}}' | jq -r .digest)
          echo "GHCR digest: $GHCR_DIGEST"
          echo "ECR  digest: $ECR_DIGEST"
          [ "$ECR_DIGEST" = "$GHCR_DIGEST" ] || { echo "::error::digest changed in the copy"; exit 1; }
          # Pin the task definition to the digest, not just the tag.
          echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${VERSION}@${ECR_DIGEST}" >> "$GITHUB_OUTPUT"

      # The task definition lives in git (scenario-c/ecs/abdur-notes-api-taskdef.json);
      # CI fills in only the account ID and the image.
      - name: Register a new task definition revision
        id: taskdef
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          jq --arg img "${{ steps.copy.outputs.image }}" --arg acct "$ACCOUNT" '
                .containerDefinitions[0].image = $img
              | .executionRoleArn |= sub("<ACCOUNT_ID>"; $acct)
              | .taskRoleArn |= sub("<ACCOUNT_ID>"; $acct)
              | .containerDefinitions[0].secrets[].valueFrom |= sub("<ACCOUNT_ID>"; $acct)
             ' scenario-c/ecs/abdur-notes-api-taskdef.json > taskdef.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://taskdef.json \
                  --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "registered $ARN"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Update the service and wait for it to settle
        run: |
          set -euo pipefail
          NEW="${{ steps.taskdef.outputs.arn }}"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW" --query 'service.deployments[0].{id:id,taskDefinition:taskDefinition,rollout:rolloutState}' --output table
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          # "Stable" is also what a circuit-breaker ROLLBACK ends in -- stable on
          # the OLD revision. So check which revision is actually primary.
          for i in $(seq 1 20); do
            PRIMARY=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query "services[0].deployments[?status=='PRIMARY'] | [0].[taskDefinition,rolloutState]" --output text)
            echo "primary deployment: $PRIMARY"
            case "$PRIMARY" in
              "$NEW"*COMPLETED) echo "service is running $NEW"; exit 0 ;;
              "$NEW"*IN_PROGRESS) sleep 15 ;;
              *) echo "::error::service did not end on $NEW (circuit breaker rolled back?)"; exit 1 ;;
            esac
          done
          echo "::error::rollout of $NEW never completed"; exit 1

      - name: Verify through the load balancer
        run: |
          set -uo pipefail
          ok=0
          for i in $(seq 1 30); do
            body=$(curl -s --max-time 5 "$ALB_URL/healthz" || true)
            echo "healthz: $body"
            case "$body" in *"\"version\":\"$VERSION\""*) ok=$((ok+1)) ;; *) ok=0 ;; esac
            [ "$ok" -ge 4 ] && break
            sleep 5
          done
          [ "$ok" -ge 4 ] || { echo "::error::ALB is not consistently serving $VERSION"; exit 1; }
          # readyz touches RDS, over TLS with verify-full since this revision.
          curl -sf --max-time 5 "$ALB_URL/readyz" && echo || { echo "::error::readyz failed -- database/TLS"; exit 1; }
